services:
  - type: web
    name: farmer-saathi
    runtime: node
    plan: free
    region: oregon

    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run db:migrate -w server && npm run start -w server

    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: TRUST_PROXY
        value: "1"

      - key: SESSION_COOKIE_NAME
        value: farmer_saathi_session

      - key: SESSION_COOKIE_SAME_SITE
        value: lax

      - key: SESSION_COOKIE_SECURE
        value: "true"

      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: "false"

      - key: DATABASE_URL
        fromDatabase:
          name: farmer-saathi-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 14d

      - key: GROQ_API_KEY
        sync: false

      - key: SARVAM_API_KEY
        sync: false

      - key: WEATHER_API_KEY
        sync: false

      - key: AGMARKNET_API_KEY
        sync: false

      - key: SMTP_HOST
        value: smtp.gmail.com

      - key: SMTP_PORT
        value: "587"

      - key: SMTP_SECURE
        value: "false"

      - key: SMTP_USER
        sync: false

      - key: SMTP_PASSWORD
        sync: false

      - key: SMTP_FROM
        value: "Farmer Saathi <noreply@farmer-saathi.com>"

databases:
  - name: farmer-saathi-db
    plan: free
    region: oregon
    databaseName: farmer_saathi
    user: farmer_user
