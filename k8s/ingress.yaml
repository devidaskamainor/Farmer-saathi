apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: farmer-saathi-ingress
  labels:
    app: farmer-saathi
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: farmer-saathi-service
                port:
                  number: 80
