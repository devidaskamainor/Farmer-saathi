name: Farmer Saathi CI Pipeline

on:
  push:
    branches:
      - main
      - spoorthy
      - jeevan
      - aiman
      - nanditha
  pull_request:
    branches:
      - main
      - spoorthy
      - jeevan
      - aiman
      - nanditha
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-architecture:
    name: Architecture & Manifest Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Kubernetes, Docker & Cross-Platform Integrity
        run: node scripts/verify-k8s-docker.mjs

  unit-tests:
    name: Backend Test Suite (120 Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Server Unit Tests
        env:
          NODE_ENV: test
          PORT: 4000
          SESSION_SECRET: test_session_secret_for_ci_at_least_32_characters_long
        run: npm run test -w server

  build-frontend:
    name: Build Frontend (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build -w client

      - name: Archive Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  docker-verification:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [validate-architecture, unit-tests, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry-Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: farmer-saathi:ci-validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
