name: Farmer Saathi CI/CD Pipeline

on:
  push:
    branches: [ main, spoorthy ]
  pull_request:
    branches: [ main, spoorthy ]

jobs:
  test:
    name: Backend Unit Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Docker and Kubernetes Manifests
        run: node scripts/verify-k8s-docker.mjs

      - name: Run Backend Test Suite
        run: node --test server/test/*.test.js

  build-frontend:
    name: Build Frontend (Vite & React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build -w client

  docker-dry-run:
    name: Verify Docker Build
    runs-on: ubuntu-latest
    needs: [test, build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: farmer-saathi:latest
